name: AI PR Review

on:
  workflow_call:
    secrets:
      GEMINI_API_KEY:
        required: true
    inputs:
      ai-model:
        required: false
        type: string
        default: gemini-3.8-flash
      ai-model-deep:
        required: false
        type: string
        default: gemini-3.1-pro

  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: Initial AI review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout agent
        uses: actions/checkout@v4
        with:
          repository: Karthik22296/pr-review-agent
          ref: ${{ github.repository == 'Karthik22296/pr-review-agent' && (github.event.pull_request.head.sha || github.sha) || 'main' }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build agent
        run: npm run build

      - name: Build review context
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh pr diff "$PR_NUMBER" --repo "$REPOSITORY" > /tmp/pr-raw.diff
          node --input-type=module -e 'import fs from "node:fs"; import("./dist/filter.js").then(({filterDiff}) => { fs.writeFileSync("/tmp/pr.diff", filterDiff(fs.readFileSync("/tmp/pr-raw.diff", "utf8"))); })'
          {
            echo "Repository: $REPOSITORY"
            echo "PR: #$PR_NUMBER"
            echo
            echo "Diff:"
            head -c 120000 /tmp/pr.diff
          } > /tmp/review-context.txt

          # Read optional repository-specific rules as data only.
          if gh api "repos/$REPOSITORY/contents/.github/pr-review.yml?ref=$HEAD_SHA" \
            --jq '.content' 2>/dev/null | base64 -d > /tmp/repo-review.yml; then
            {
              echo
              echo "Repository-specific review configuration:"
              cat /tmp/repo-review.yml
            } >> /tmp/review-context.txt
          fi

          {
            echo 'context<<EOF'
            cat /tmp/review-context.txt
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Detect repository stack
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          TREE_SHA=$(gh api "repos/$REPOSITORY/commits/$HEAD_SHA" --jq '.commit.tree.sha')
          gh api "repos/$REPOSITORY/git/trees/$TREE_SHA?recursive=1" --jq '.tree[] | select(.type=="blob") | .path' > /tmp/repo-files.txt
          node --input-type=module -e 'import fs from "node:fs"; import("./dist/stack.js").then(({detectStack}) => { const stack=detectStack(fs.readFileSync("/tmp/repo-files.txt","utf8").split("\\n").filter(Boolean)); fs.appendFileSync("/tmp/review-context.txt", "\\nRepository stack detected:\\n"+JSON.stringify(stack,null,2)); })'

      - name: Add relevant source context
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh api "repos/$REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" --paginate --jq '.[].filename' | head -n 50 > /tmp/changed-files-raw.txt
          node --input-type=module -e 'import fs from "node:fs"; import("./dist/filter.js").then(({isIgnoredFile}) => { const files = fs.readFileSync("/tmp/changed-files-raw.txt", "utf8").split("\n").filter(f => f && !isIgnoredFile(f)).slice(0, 20); fs.writeFileSync("/tmp/changed-files.txt", files.join("\n")); })'
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            encoded=$(node -e 'console.log(encodeURIComponent(process.argv[1]))' "$path")
            if content=$(gh api "repos/$REPOSITORY/contents/$encoded?ref=$HEAD_SHA" --jq '.content' 2>/dev/null | tr -d '\n' | base64 -d 2>/dev/null); then
              printf '\n--- Source: %s ---\n' "$path" >> /tmp/review-context.txt
              printf '%s\n' "$content" | head -c 20000 >> /tmp/review-context.txt
              printf '\n' >> /tmp/review-context.txt
            fi
          done < /tmp/changed-files.txt

      - name: Collect existing CI results
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          {
            echo
            echo "Existing CI/check results:"
            gh api "repos/$REPOSITORY/commits/$HEAD_SHA/check-runs?per_page=100" --jq '.check_runs[] | select(.conclusion != null and .name != "Initial AI review") | "- " + .name + ": " + .conclusion'
          } >> /tmp/review-context.txt

      - name: Prepare repository rules
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if gh api "repos/$REPOSITORY/contents/.github/pr-review.yml?ref=$HEAD_SHA" --jq '.content' 2>/dev/null | base64 -d > /tmp/repo-pr-review.yml; then
            echo "REPOSITORY_RULES_FILE=/tmp/repo-pr-review.yml" >> "$GITHUB_ENV"
          fi

      - name: Triage PR Risk
        id: triage
        env:
          REVIEW_CONTEXT_FILE: /tmp/review-context.txt
        run: node dist/triage.js

      - name: Run AI review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REVIEW_CONTEXT_FILE: /tmp/review-context.txt
          AI_PROVIDER: gemini
          AI_MODEL: ${{ steps.triage.outputs.is_risky == 'true' && (inputs.ai-model-deep || 'gemini-3.1-pro') || (inputs.ai-model || 'gemini-3.8-flash') }}
          DEEP_REVIEW_MODE: ${{ steps.triage.outputs.is_risky }}
          TRIAGE_REASON: ${{ steps.triage.outputs.triage_reason }}
        run: node dist/index.js > /tmp/review.json

      - name: Publish review
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          if (!fs.existsSync('/tmp/review.json') || fs.statSync('/tmp/review.json').size === 0) {
            console.log('No review output generated (e.g. GEMINI_API_KEY secret not configured). Skipping comment publication.');
            process.exit(0);
          }
          const r = JSON.parse(fs.readFileSync('/tmp/review.json', 'utf8'));

          const riskBadge = {
            low: '🟢 **Risk Level: Low**',
            medium: '🟡 **Risk Level: Medium**',
            high: '🔴 **Risk Level: High**'
          }[r.riskLevel || 'low'] || '🟢 **Risk Level: Low**';

          const riskSection = r.riskReason
            ? `${riskBadge} — *${r.riskReason}*`
            : riskBadge;

          let walkthroughSection = '';
          if (Array.isArray(r.fileWalkthrough) && r.fileWalkthrough.length > 0) {
            const rows = r.fileWalkthrough.map(f => `| \`${f.path}\` | ${f.summary} |`).join('\n');
            walkthroughSection = `### 📋 Changes Walkthrough\n| File | Summary |\n| :--- | :--- |\n${rows}`;
          }

          const severityMap: Record<string, string> = {
            critical: '🔴 CRITICAL',
            high: '🟠 HIGH',
            medium: '🟡 MEDIUM',
            low: '🔵 LOW',
            good: '✅ GOOD'
          };
          const findings = (r.findings || []).map(f => {
            const suggestion = f.suggestion ? `\n\n\`\`\`suggestion\n${f.suggestion}\n\`\`\`` : '';
            const sev = severityMap[f.severity] || f.severity.toUpperCase();
            return `- **${sev} — ${f.title}** (${f.category})\n  ${f.body}${suggestion}`;
          }).join('\n\n');

          const tests = (r.tests || []).map(t => `- ${t}`).join('\n');

          const bodyParts = [
            '## 🤖 Initial PR Review',
            '',
            riskSection,
            '',
            '### Summary',
            r.summary || 'No summary provided.',
            ''
          ];

          if (walkthroughSection) {
            bodyParts.push(walkthroughSection, '');
          }

          bodyParts.push(
            findings ? '### 🔍 Findings\n\n' + findings : '### 🔍 Findings\n\nNo high-confidence issues identified.',
            ''
          );

          if (tests) {
            bodyParts.push('### 🧪 Recommended Tests\n\n' + tests, '');
          }

          bodyParts.push(
            '> Informational review generated by the global PR Review Agent. Human review remains authoritative.'
          );

          fs.writeFileSync('/tmp/review.md', bodyParts.join('\n'));
          NODE
          if [ -f /tmp/review.md ]; then
            gh pr review "$PR_NUMBER" --repo "$REPOSITORY" --comment --body-file /tmp/review.md || gh pr comment "$PR_NUMBER" --repo "$REPOSITORY" --body-file /tmp/review.md
          fi

      - name: Publish inline comments
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node dist/publish-inline.js

      - name: Add PR labels
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh label create "ai-reviewed" --repo "$REPOSITORY" --color "0E8A16" --description "Reviewed by AI PR Review Agent" 2>/dev/null || true
          gh pr edit "$PR_NUMBER" --repo "$REPOSITORY" --add-label "ai-reviewed" 2>/dev/null || true
