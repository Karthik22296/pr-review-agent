name: AI PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: Initial AI review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event.pull_request.draft == false
    steps:
      - name: Checkout agent
        uses: actions/checkout@v4
        with:
          repository: Karthik22296/pr-review-agent
          ref: main

      - name: Build review context
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr diff "${{ github.event.pull_request.number }}"             --repo "${{ github.repository }}" > /tmp/pr.diff
          {
            echo "Repository: ${{ github.repository }}"
            echo "PR: #${{ github.event.pull_request.number }}"
            echo
            echo "Diff:"
            head -c 120000 /tmp/pr.diff
          } > /tmp/review-context.txt
          {
            echo 'context<<EOF'
            cat /tmp/review-context.txt
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build agent
        run: npm run build

      - name: Run AI review
        id: review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REVIEW_CONTEXT: ${{ steps.context.outputs.context }}
          AI_PROVIDER: gemini
          AI_MODEL: ${{ vars.AI_MODEL || 'gemini-2.5-flash' }}
        run: |
          node dist/index.js > /tmp/review.json
          cat /tmp/review.json

      - name: Publish review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const r = JSON.parse(fs.readFileSync('/tmp/review.json', 'utf8'));
          const findings = (r.findings || []).map(f =>
            `- **${f.severity.toUpperCase()} — ${f.title}** (${f.category})\\n  ${f.body}`
          ).join('\\n');
          const tests = (r.tests || []).map(t => `- ${t}`).join('\\n');
          const body = [
            '## 🤖 Initial PR Review',
            '',
            r.summary || 'No summary provided.',
            '',
            findings ? '### Findings\\n' + findings : '### Findings\\nNo high-confidence findings identified.',
            '',
            tests ? '### Tests\\n' + tests : '',
            '',
            '> Informational review generated by the global PR Review Agent. Human review remains authoritative.'
          ].join('\\n');
          fs.writeFileSync('/tmp/review.md', body);
          NODE
          gh pr comment "${{ github.event.pull_request.number }}"             --repo "${{ github.repository }}"             --body-file /tmp/review.md
